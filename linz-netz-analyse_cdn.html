<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --eeg:#5da831;
  --netz:#1eaabd;
  --bg:#f0f2f5;
  --card:#ffffff;
  --border:#e0e4ea;
  --text:#1a1d23;
  --muted:#6b7280;
}
body{font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:16px 24px;background:var(--card);border-bottom:1px solid var(--border);font-size:20px;font-weight:700;letter-spacing:-0.3px;display:flex;align-items:center;gap:12px}
.version-badge{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;white-space:nowrap;text-decoration:none;transition:background .15s}
.version-badge:hover{background:#e4e7ec}
.container{padding:20px 24px;display:flex;flex-direction:column;gap:16px}

.drop-zone{
  border:2px dashed var(--border);border-radius:12px;background:var(--card);
  padding:32px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.drop-zone.over{border-color:var(--netz);background:#f0fbfc}
.drop-zone input[type=file]{display:none}
.drop-zone-label{color:var(--muted);font-size:14px;margin-top:8px}
.drop-btn{
  display:inline-block;padding:8px 18px;border-radius:8px;background:var(--netz);color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;border:none;margin-bottom:8px;
}
.drop-btn:hover{opacity:.88}
.file-info{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.toolbar.hidden{display:none}
.toolbar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.toolbar input[type=date],.toolbar select{
  padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;color:var(--text);
}
.info-badge{margin-left:auto;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .value{font-size:22px;font-weight:700;color:var(--text)}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.chart-legend{display:flex;gap:18px;margin-bottom:10px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart-wrap{position:relative;height:280px}

.table-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-scroll{max-height:400px;overflow:auto}
.card-title{padding:12px 10px 8px;font-size:14px;font-weight:600}
.table-note{padding:0 10px;font-size:12px;color:var(--muted)}
.table-note:not(:empty){padding:8px 10px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:#fafbfc;border-bottom:1px solid var(--border);padding:8px 10px;font-size:12px;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap}
tbody td{padding:7px 10px;border-bottom:1px solid #f0f2f5;font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8f9fb}

.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px;line-height:18px}
.badge-M{background:#d1fae5;color:#065f46}
.badge-EB{background:#fef3c7;color:#92400e}
.badge-NV{background:#fee2e2;color:#991b1b}
.badge-EN{background:#fce7f3;color:#9d174d}
.badge-other{background:#f3f4f6;color:var(--muted)}
.eeg-val{color:var(--eeg);font-weight:500}
.netz-val{color:var(--netz);font-weight:500}

.no-data{padding:20px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<header>
  <span>Linz Netz Analyse</span>
  <a class="version-badge" id="versionBadge" href="https://github.com/4e-schwertberg/linz-netz-analyse/releases/tag/v2" target="_blank" rel="noopener"><!-- VERSION_START -->v2-7082f7f<!-- VERSION_END --></a>
</header>

<div class="container">

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple accept=".csv"/>
    <label class="drop-btn" for="fileInput">CSV-Dateien auswählen</label>
    <div class="drop-zone-label">oder Dateien hierher ziehen</div>
    <div class="drop-zone-label">Tipp: Für Monatsspitzen Viertelstundenwerte über ganze Monate exportieren.</div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <div class="toolbar hidden" id="toolbar">
    <label>Von <input type="date" id="fromDate"/></label>
    <label>Bis <input type="date" id="toDate"/></label>
    <label>Aggregation
      <select id="modeSelect">
        <option value="auto">Auto</option>
        <option value="raw">Original</option>
        <option value="hour">Stunde</option>
        <option value="day">Tag</option>
      </select>
    </label>
    <span class="info-badge" id="infoBadge">–</span>
  </div>

  <div class="kpis" id="kpisSection" style="display:none"></div>

  <div class="chart-card" id="chartSection" style="display:none">
    <div class="chart-legend" id="chartLegend"></div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <div class="table-card" id="peakSection" style="display:none">
    <div class="card-title" id="peakTitle"></div>
    <div class="table-scroll">
      <table>
        <thead><tr id="peakHead"></tr></thead>
        <tbody id="peakBody"></tbody>
      </table>
    </div>
  </div>

  <div class="table-card" id="tableSection" style="display:none">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Zeit</th>
            <th>Gesamt<span class="unit"></span></th>
            <th>EEG<span class="unit"></span></th>
            <th>Netzbezug<span class="unit"></span></th>
            <th>Status EEG</th>
            <th>Qualität</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-note" id="tableNote"></div>
  </div>

</div>

<script>
let chartInstance = null;
let allRows = [];
let isPower = false;   // true: kW values, false: kWh values
let stepMinutes = 15;  // resolution of the loaded data: 15, 60 or 1440

const snapPlugin = {
  id: 'snap',
  beforeDraw(chart) {
    const show = chart.options.plugins.snap && chart.options.plugins.snap.show;
    if (!show) return;
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.x) return;

    const xScale = scales.x;
    const minTs = xScale.min;
    const maxTs = xScale.max;
    if (minTs == null || maxTs == null) return;

    ctx.save();
    ctx.fillStyle = 'rgba(255,193,7,0.10)';

    const startDay = new Date(minTs);
    startDay.setHours(0, 0, 0, 0);
    const endDay = new Date(maxTs);

    for (let d = new Date(startDay); d <= endDay; d.setDate(d.getDate() + 1)) {
      const month = d.getMonth() + 1;
      if (month < 4 || month > 9) continue;

      const snapStart = new Date(d);
      snapStart.setHours(10, 0, 0, 0);
      const snapEnd = new Date(d);
      snapEnd.setHours(16, 0, 0, 0);

      const x1 = xScale.getPixelForValue(snapStart.getTime());
      const x2 = xScale.getPixelForValue(snapEnd.getTime());

      const left = Math.max(x1, chartArea.left);
      const right = Math.min(x2, chartArea.right);
      if (right <= left) continue;

      ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
    }

    ctx.restore();
  }
};

Chart.register(snapPlugin);

function toNumber(val) {
  if (val === null || val === undefined || val === '') return 0;
  return parseFloat(String(val).replace(',', '.').trim()) || 0;
}

function parseGridUsage(val, total) {
  if (val === null || val === undefined || String(val).trim() === '') return total;
  return toNumber(val);
}
  
function parseLinzDate(str) {
  if (!str) return null;
  str = String(str).trim().replace(/\r/g, '');
  if (str.includes(' ')) {
    const [datePart, timePart] = str.split(' ');
    const parts = datePart.split('.');
    if (parts.length < 3) return null;
    const [day, month, year] = parts;
    const fullYear = year; // '20' + year ??
    const d = new Date(`${fullYear}-${month.padStart(2,'0')}-${day.padStart(2,'0')}T${timePart}:00`);
    return isNaN(d.getTime()) ? null : d;
  }
  const parts = str.split('.');
  if (parts.length < 3) return null;
  const [day, month, year] = parts;
  const fullYear = year; // '20' + year ??
  const d = new Date(`${fullYear}-${month.padStart(2,'0')}-${day.padStart(2,'0')}T00:00:00`);
  return isNaN(d.getTime()) ? null : d;
}

function detectFormat(headers) {
  const has = h => headers.includes(h);
  if (has('Datum von') && has('Leistung in kW')) {
    return { isPower: true, date: 'Datum von', value: 'Leistung in kW', rest: 'Restnetzbezug in kW (Energiegemeinschaft)' };
  }
  if (has('Energiemenge in kWh') && (has('Datum von') || has('Datum'))) {
    const date = has('Datum von') ? 'Datum von' : 'Datum';
    return { isPower: false, date, value: 'Energiemenge in kWh', rest: 'Restnetzbezug in kWh (Energiegemeinschaft)' };
  }
  return null;
}

const isBlank = val => val === null || val === undefined || String(val).trim() === '';

// Smallest distance between two rows, rounded up to 15 min, 1 h or 1 day
function resolutionOf(sortedRows) {
  let min = Infinity;
  for (let i = 1; i < sortedRows.length; i++) {
    const diff = (sortedRows[i].time - sortedRows[i - 1].time) / 60000;
    if (diff > 0 && diff < min) min = diff;
  }
  if (min <= 15) return 15;
  return min <= 60 ? 60 : 1440;
}

function parseCSVText(text) {
  const result = Papa.parse(text, {
    header: true,
    skipEmptyLines: true,
    dynamicTyping: false,
    delimiter: ';',
  });
  const fmt = detectFormat(result.meta.fields || []);
  if (!fmt) throw new Error('Unbekanntes CSV-Format');

  const rows = [];
  const seen = new Set();
  for (const row of result.data) {
    let time = parseLinzDate(row[fmt.date]);
    if (!time || isBlank(row[fmt.value])) continue;

    // The hour repeated at the end of daylight saving time: second occurrence is one hour later
    if (seen.has(time.getTime())) {
      const later = new Date(time.getTime() + 3600000);
      if (later.getHours() === time.getHours()) time = later;
    }
    seen.add(time.getTime());

    const total = toNumber(row[fmt.value]);
    const grid = parseGridUsage(row[fmt.rest], total);
    const hasGrid = !isBlank(row[fmt.rest]);
    const eeg = Math.max(total - grid, 0);
    const ersatzwert = (row['Ersatzwert'] || '').trim();
    const statusEEG = (row['Status (Energiegemeinschaft)'] || '').trim();
    rows.push({ time, total, grid, hasGrid, eeg, ersatzwert, substitute: ersatzwert !== '', statusEEG });
  }
  if (rows.length === 0) throw new Error('Keine Daten gefunden');
  rows.sort((a, b) => a.time - b.time);
  return { rows, isPower: fmt.isPower, stepMinutes: resolutionOf(rows) };
}

function resolveMode(rows, modeSelect) {
  if (modeSelect === 'auto') {
    if (rows.length <= 1000) return 'raw';
    if (rows.length <= 5000) return 'hour';
    return 'day';
  }
  return modeSelect;
}

// Energy is summed up. For power the maximum is kept, so that peaks stay visible.
function aggregate(rows, mode) {
  if (mode === 'raw') return rows;

  const map = new Map();

  for (const r of rows) {
    const d = r.time;
    // subtracting the minutes keeps both 02:00 hours apart when daylight saving time ends
    const key = mode === 'hour'
      ? d.getTime() - d.getMinutes() * 60000
      : new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if (!map.has(key)) {
      map.set(key, { time: new Date(key), total: 0, grid: 0, eeg: 0, hasGrid: !isPower, substitute: false, ersatzwert: '', statusEEG: '' });
    }
    const entry = map.get(key);
    entry.substitute ||= r.substitute;
    if (isPower) {
      entry.total = Math.max(entry.total, r.total);
      if (r.hasGrid) {
        entry.grid = Math.max(entry.grid, r.grid);
        entry.hasGrid = true;
      }
    } else {
      entry.total += r.total;
      entry.grid += r.grid;
      entry.eeg += r.eeg;
      entry.hasGrid &&= r.hasGrid;
    }
  }

  const result = [...map.values()];
  if (isPower) {
    for (const entry of result) {
      entry.eeg = null; // maxima of different quarter hours cannot be split into shares
      if (!entry.hasGrid) entry.grid = null;
    }
  }
  result.sort((a, b) => a.time - b.time);
  return result;
}

function filterRows(rows) {
  const fromVal = document.getElementById('fromDate').value;
  const toVal = document.getElementById('toDate').value;
  const fromTime = fromVal ? new Date(fromVal + 'T00:00:00') : null;
  const toTime = toVal ? new Date(toVal + 'T23:59:59') : null;
  return rows.filter(r => {
    if (fromTime && r.time < fromTime) return false;
    if (toTime && r.time > toTime) return false;
    return true;
  });
}

function setDateRange(rows) {
  if (rows.length === 0) return;
  const min = rows[0].time; // rows are sorted by time
  const max = rows[rows.length - 1].time;
  const fmt = d => {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };
  document.getElementById('fromDate').value = fmt(min);
  document.getElementById('toDate').value = fmt(max);
}

function fmtNum(n, decimals) {
  return n.toLocaleString('de-AT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtDateTime(d) {
  return d.toLocaleString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function fmtInterval(start, minutes) {
  const end = new Date(start.getTime() + minutes * 60000);
  return `${fmtDateTime(start)}–${end.toLocaleTimeString('de-AT', { hour:'2-digit', minute:'2-digit' })}`;
}

function maxBy(rows, key) {
  return rows.reduce((best, r) => (!best || r[key] > best[key] ? r : best), null);
}

function powerKPIs(rows) {
  const peakCard = (label, row, key) => row
    ? [label, `${fmtNum(row[key], 3)} kW`, fmtDateTime(row.time)]
    : [label, '–'];
  const avg = rows.reduce((s, r) => s + r.total, 0) / rows.length;
  const cards = [
    peakCard('Höchste Leistung', maxBy(rows, 'total'), 'total'),
    ['Ø Leistung', rows.length > 0 ? `${fmtNum(avg, 3)} kW` : '–'],
  ];
  const restRows = rows.filter(r => r.hasGrid);
  if (restRows.length > 0) cards.push(peakCard('Höchste Restleistung', maxBy(restRows, 'grid'), 'grid'));
  return cards;
}

function energyKPIs(rows) {
  const total = rows.reduce((s, r) => s + r.total, 0);
  const eeg = rows.reduce((s, r) => s + r.eeg, 0);
  const grid = rows.reduce((s, r) => s + r.grid, 0);
  const share = total > 0 ? (eeg / total) * 100 : 0;
  const days = new Set(rows.map(r => r.time.toDateString())).size;
  const avg = days > 0 ? total / days : 0;
  const kWh = n => `${fmtNum(n, 2)} kWh`;
  return [
    ['Gesamtverbrauch', kWh(total)],
    ['EEG-Anteil', kWh(eeg)],
    ['Netzbezug', kWh(grid)],
    ['EEG %', `${fmtNum(share, 1)} %`],
    ['Ø pro Tag', kWh(avg)],
  ];
}

function renderKPIs(rows) {
  const cards = isPower ? powerKPIs(rows) : energyKPIs(rows);
  document.getElementById('kpisSection').innerHTML = cards.map(([label, value, sub]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div>` +
    (sub ? `<div class="sub">${sub}</div>` : '') +
    `</div>`
  ).join('');
}

function energyDatasets(rows) {
  const area = (label, data, color, order) => ({
    label, data, order,
    backgroundColor: color + 'cc', borderColor: color, borderWidth: 1.5,
    fill: true, tension: 0.15, pointRadius: 0,
  });
  return [
    area('EEG', rows.map(r => r.eeg), '#5da831', 2),
    area('Netzbezug', rows.map(r => r.grid), '#1eaabd', 1),
  ];
}

function powerDatasets(rows) {
  const steps = (label, data, color, order) => ({
    label, data, order,
    backgroundColor: color, borderColor: color, borderWidth: 1.5,
    fill: false, stepped: 'before', pointRadius: rows.length === 1 ? 3 : 0,
  });
  const datasets = [steps('Gesamt', rows.map(r => r.total), '#d97706', 2)];
  if (rows.some(r => r.hasGrid)) {
    datasets.push(steps('Netzbezug', rows.map(r => r.hasGrid ? r.grid : null), '#1eaabd', 1));
  }
  return datasets;
}

function renderChart(rows, mode) {
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  const datasets = isPower ? powerDatasets(rows) : energyDatasets(rows);
  document.getElementById('chartLegend').innerHTML = datasets.map(d =>
    `<span><span class="dot" style="background:${d.borderColor}"></span>${d.label}</span>`
  ).join('');

  const showSnap = !isPower && mode !== 'day';
  const tooltip = isPower
    ? { callbacks: { label: c => `${c.dataset.label}: ${fmtNum(c.parsed.y, 3)} kW` } }
    : {};

  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: rows.map(r => r.time), datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        snap: { show: showSnap },
        tooltip,
      },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'dd.MM.yyyy HH:mm' },
          ticks: { maxTicksLimit: 10, color: '#6b7280', font: { size: 11 } },
          grid: { color: '#f0f2f5' },
        },
        y: {
          stacked: !isPower,
          beginAtZero: true,
          title: { display: isPower, text: 'kW' },
          ticks: { color: '#6b7280', font: { size: 11 } },
          grid: { color: '#f0f2f5' },
        },
      },
    },
  });
}

function badgeHtml(code) {
  const cls = ['M','EB','NV','EN'].includes(code) ? `badge-${code}` : 'badge-other';
  const text = code.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  return `<span class="badge ${cls}">${text || '–'}</span>`;
}

// Power files: highest quarter hour per month. Energy files: highest clock hour per month.
function monthlyPeaks(rows) {
  const months = new Map();
  const monthOf = d => {
    const key = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    if (!months.has(key)) months.set(key, { start: new Date(key), count: 0, buckets: [] });
    return months.get(key);
  };
  for (const r of rows) monthOf(r.time).count++;
  for (const b of isPower ? rows : aggregate(rows, 'hour')) monthOf(b.time).buckets.push(b);

  return [...months.values()].map(({ start, count, buckets }) => {
    const nextMonth = new Date(start.getFullYear(), start.getMonth() + 1, 1);
    const expected = (nextMonth - start) / (stepMinutes * 60000); // accounts for clock changes
    return {
      start,
      coverage: count / expected,
      peak: maxBy(buckets, 'total'),
      restPeak: maxBy(buckets.filter(b => b.hasGrid), 'grid'),
    };
  });
}

function renderPeaks(rows) {
  const available = isPower ? stepMinutes === 15 : stepMinutes <= 60;
  document.getElementById('peakSection').style.display = available ? '' : 'none';
  if (!available) return;

  const unit = isPower ? 'kW' : 'kWh';
  const minutes = isPower ? 15 : 60;
  const hasRest = rows.some(r => r.hasGrid);
  const headers = ['Monat', 'Spitze', ...(hasRest ? ['Restnetz-Spitze'] : []), 'Daten'];
  const cell = (row, key) => row
    ? `<td><strong>${fmtNum(row[key], 3)} ${unit}</strong><br>${fmtInterval(row.time, minutes)}</td>`
    : '<td>–</td>';

  document.getElementById('peakTitle').textContent = isPower
    ? 'Monatsspitzen · höchste Viertelstunde'
    : 'Monatsspitzen · höchste volle Stunde';
  document.getElementById('peakHead').innerHTML = headers.map(h => `<th>${h}</th>`).join('');

  const body = monthlyPeaks(rows).map(({ start, coverage, peak, restPeak }) => {
    const notes = [coverage >= 1 ? 'vollständig' : `unvollständig (${Math.floor(coverage * 100)} %)`];
    if (peak.substitute) notes.push('Spitze mit Ersatzwert');
    if (restPeak && restPeak.substitute) notes.push('Restnetz-Spitze mit Ersatzwert');
    const month = start.toLocaleDateString('de-AT', { month: 'long', year: 'numeric' });
    return `<tr><td>${month}</td>${cell(peak, 'total')}${hasRest ? cell(restPeak, 'grid') : ''}<td>${notes.join('<br>')}</td></tr>`;
  }).join('');
  document.getElementById('peakBody').innerHTML =
    body || `<tr><td colspan="${headers.length}" class="no-data">Keine Daten</td></tr>`;
}

function renderTable(rows) {
  document.querySelectorAll('.unit').forEach(el => el.textContent = isPower ? ' (kW)' : '');
  document.getElementById('tableNote').textContent =
    isPower && rows.length > 1000 ? `Erste 1000 von ${rows.length} Zeilen` : '';
  const val = n => n === null ? '–' : fmtNum(n, 3);
  const tbody = document.getElementById('tableBody');
  const visible = rows.slice(0, 1000);
  if (visible.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="no-data">Keine Daten</td></tr>';
    return;
  }
  const parts = [];
  for (const r of visible) {
    const timeStr = fmtDateTime(r.time);
    parts.push(
      `<tr>` +
      `<td>${timeStr}</td>` +
      `<td>${val(r.total)}</td>` +
      `<td class="eeg-val">${val(r.eeg)}</td>` +
      `<td class="netz-val">${val(r.grid)}</td>` +
      `<td>${badgeHtml(r.statusEEG)}</td>` +
      `<td>${badgeHtml(r.ersatzwert)}</td>` +
      `</tr>`
    );
  }
  tbody.innerHTML = parts.join('');
}

function showResults(visible) {
  document.getElementById('toolbar').classList.toggle('hidden', !visible);
  for (const id of ['kpisSection', 'chartSection', 'peakSection', 'tableSection']) {
    document.getElementById(id).style.display = visible ? '' : 'none';
  }
}

function renderAll() {
  if (allRows.length === 0) return;

  const filtered = filterRows(allRows);
  const modeSelectVal = document.getElementById('modeSelect').value;
  const resolvedMode = resolveMode(filtered, modeSelectVal);
  const aggregated = aggregate(filtered, resolvedMode);

  showResults(true);

  const maxHint = isPower && resolvedMode !== 'raw' ? ' · Maximum' : '';
  document.getElementById('infoBadge').textContent = `${aggregated.length} Punkte · ${resolvedMode}${maxHint}`;

  renderKPIs(filtered);
  renderChart(aggregated, resolvedMode);
  renderPeaks(filtered);
  renderTable(aggregated);
}

async function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error(`Fehler beim Lesen: ${file.name}`));
    reader.readAsText(file, 'utf-8');
  });
}

async function loadFiles(files) {
  const info = document.getElementById('fileInfo');
  try {
    let rows = [];
    let first = null;
    const loaded = new Set(); // timestamps of previous files, so overlaps are not counted twice
    for (const file of files) {
      let data;
      try {
        data = parseCSVText(await readFileAsText(file));
      } catch (err) {
        throw new Error(`${file.name}: ${err.message}`);
      }
      first ||= data;
      if (data.isPower !== first.isPower || data.stepMinutes !== first.stepMinutes) {
        throw new Error('Bitte nur Dateien gleicher Art (Leistung oder Energie) und Auflösung gemeinsam laden');
      }
      rows = rows.concat(data.rows.filter(r => !loaded.has(r.time.getTime())));
      for (const r of data.rows) loaded.add(r.time.getTime());
    }
    allRows = rows.sort((a,b) => a.time - b.time);
    isPower = first.isPower;
    stepMinutes = first.stepMinutes;

    const n = files.length;
    info.textContent = `${n} Datei${n !== 1 ? 'en' : ''} geladen · ${allRows.length} Zeilen`;
    info.style.color = '';

    setDateRange(allRows);
    renderAll();
  } catch (err) {
    allRows = [];
    showResults(false);
    info.textContent = `Fehler: ${err.message}`;
    info.style.color = 'red';
  }
}

document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files.length > 0) loadFiles([...e.target.files]);
  e.target.value = ''; // allows selecting the same file again
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const files = [...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.csv'));
  if (files.length > 0) loadFiles(files);
});

document.getElementById('fromDate').addEventListener('change', renderAll);
document.getElementById('toDate').addEventListener('change', renderAll);
document.getElementById('modeSelect').addEventListener('change', renderAll);
</script>
</body>
